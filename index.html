<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion School</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="" alt="logo">
            <h1>Lion School</h1>
        </div>
        <div class="botao-sair">
            <img src="" alt="sair">
            <h1>Sair</h1>
        </div>
        <div class="botao-voltar">
            <img src="" alt="voltar">
            <h1>Voltar</h1>
        </div>
    </header>
    <main>
        <div class="container-cursos">
            <h1>Escolha um <a href="">curso</a>
                para gerenciar</h1>
            <img src="" alt="computador">
            <img src="" alt="cursante">
            <div class="cursos">
                <div class="ds">
                    <img src="" alt="desenvolvimento-sistemas">
                    <h2>DS</h2>
                </div>
                <div class="redes">
                    <img src="" alt="redes">
                    <h2>REDES</h2>
                </div>
            </div>
        </div>
        <div class="container-curso">
            <div class="menu-curso">
                <div class="status-curso">
                    <select name="status" id="status-curso">
                        <option value="status">Status</option>
                        <option value="finalizado">Finalizado</option>
                        <option value="cursando">Cursando</option>
                    </select>
                </div>
                <div class="legenda-cursos">
                    <h2>LEGENDA</h2>
                    <div class="cursando">
                        <div class="indicador-cursando"></div>
                        <h2>Cursando</h2>
                    </div>
                    <div class="finalizado">
                        <div class="indicador-finalizado"></div>
                        <h2>Finalizado</h2>
                    </div>
                </div>
            </div>
            <h1 id="nome-curso"></h1>
            <div class="alunos-curso" id="alunos">
                <div class="aluno">
                    <img src="" alt="foto-perfil">
                    <h1></h1>
                </div>
            </div>
        </div>
        <div class="container-aluno">
            <div class="detalhes-aluno">
                <img src="" alt="foto-aluno" id="foto-aluno">
                <h1 id="nome-aluno"></h1>
            </div>
            <div class="notas-aluno">
                <div class="nota-aluno">
                    <h1 id="nota-aluno"></h1>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
