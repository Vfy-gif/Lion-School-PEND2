<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Lion School</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="./img/logo-image.png" alt="logo">
            <h1>Lion School</h1>
        </div>
        <div class="botao-sair active">
            <img src="./img/voltar-sair-image.svg" alt="sair">
            <h1>Sair</h1>
        </div>
        <div class="botao-voltar">
            <img src="./img/voltar-sair-image.svg" alt="voltar">
            <h1>Voltar</h1>
        </div>
    </header>
    <main>
        <div class="container-cursos active">
            <div class="anuncio-curso">
                <h1>Escolha um <a href="">curso</a>
                    para gerenciar</h1>
                <img src="./img/devices.svg" alt="computador">
            </div>
            <img src="./img/studant.svg" alt="cursante">
            <div class="cursos">
                <div class="ds">
                    <img src="./img//icon-desenvolvimento.svg" alt="desenvolvimento-sistemas">
                    <h2>DS</h2>
                </div>
                <div class="redes">
                    <img src="./img/icon-redes.svg" alt="redes">
                    <h2>REDES</h2>
                </div>
            </div>
        </div>
        <div class="container-curso">
            <div class="menu-curso">
                <div class="status-curso">
                    <select name="status" id="status-curso">
                        <option value="status">Status</option>
                        <option value="finalizado">Finalizado</option>
                        <option value="cursando">Cursando</option>
                    </select>
                </div>
                <div class="legenda-cursos">
                    <h2>LEGENDA</h2>
                    <div class="cursando">
                        <div class="indicador-cursando"></div>
                        <h2>Cursando</h2>
                    </div>
                    <div class="finalizado">
                        <div class="indicador-finalizado"></div>
                        <h2>Finalizado</h2>
                    </div>
                </div>
            </div>
            <h1 id="nome-curso"></h1>
            <div class="alunos-curso" id="alunos">
                <div class="aluno">
                    <img src="" alt="foto-perfil">
                    <h1></h1>
                </div>
            </div>
        </div>
        <div class="container-aluno">
            <div class="detalhes-aluno">
                <img src="" alt="foto-aluno" id="foto-aluno">
                <h1 id="nome-aluno"></h1>
            </div>
            <div class="notas-aluno">
                <div class="nota-aluno">
                    <h1 id="nota-aluno"></h1>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="sociais">
            <div class="contatos">
                <div class="telefone">
                    <img src="./img/icon-telefone.svg" alt="telefone">
                    <h1>(11) 4774-4700</h1>
                </div>
                <div class="email">
                    <img src="./img/icon-email.svg" alt="email">
                    <h1>lionschool@gmail.com</h1>
                </div>
                <div class="local">
                    <img src="./img/icon-local.svg" alt="local">
                    <h1>Rua tcc, 211, Centro, Jandira</h1>
                </div>
            </div>
            <h1>Copyright © 2022 | Vitor Miguel</h1>
            <div class="redes-sociais">
                <div class="youtube">
                    <img src="./img/icon-youtube.svg" alt="youtube">
                </div>
                <div class="twitter">
                    <img src="./img/icon-twitter.svg" alt="twitter">
                </div>
                <div class="instagram">
                    <img src="./img/icon-instagram.svg" alt="instagram">
                </div>
                <div class="facebook">
                    <img src="./img/icon-facebook.svg" alt="facebook">
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
